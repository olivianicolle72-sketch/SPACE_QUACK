<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPACE FISH — SPACE QUACK</title>
    <link rel="stylesheet" href="game.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <a href="superbase/superbase.html" class="btn-dados">DADOS</a>

    <header class="br">
        <h1>SPACE QUACK</h1>
    </header>
   
    <div class="container">
        <form id="from" hidden>
            <input type="hidden" id="idJogador">

            <h2 id="tituloForm">REGISTRO DO ASTRONAUTA</h2>

            <p>DIGITE O NOME DO ASTRONAUTA</p>
            <input type="text" placeholder="Seu nome" id="nome" maxlength="20">

            <p>DIGITE SEU NICK</p>
            <input type="text" placeholder="Seu nome de usuário" id="user" maxlength="20">

            <p>DIGITE A IDADE</p>
            <input type="number" min="18" max="50" id="idade">

            <p>SELECIONE O GÊNERO</p>
            <input type="radio" id="feminino" name="genero" value="Feminino">
            <label for="feminino">Feminino</label><br>

            <input type="radio" id="masculino" name="genero" value="Masculino">
            <label for="masculino">Masculino</label><br>

            <input type="radio" id="neutro" name="genero" value="Neutro">
            <label for="neutro">Gênero Neutro</label>
            <br><br>

            <button id="ENVIAR" type="submit">ENVIAR</button>
            <button id="CANCELAR_EDICAO" type="button" class="btn-cancelar" hidden>CANCELAR</button>
        </form>

        <section id="painelSlots" aria-label="Slots de Astronautas">
            <div id="contador">4 SLOTS DISPONÍVEIS</div>
            <div id="listaJogadores"></div>
        </section>
    </div>

    <script src="/superbase/jogador.config.js"></script>
    <script src="jg.js"></script>
</body>
</html>
